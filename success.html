<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for kon narak</title>
<style>
    html,body {
        background-color: #ffedff;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .box {
        text-align: center;
        text-align: center;
        width: 100%
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        padding: 0 20px
        box-sizing: border-box
    }
    h1  {
        margin: 0 0 20px 0;
        text-align: center;
        font-size: 45px; 
        color: #ff9cf8;
    }
    
    .B1, .B2 {
        font-size: 20px;
        background-color: #fffad4;
        border-radius: 8px;
        cursor: pointer;
        border: 2px solid #ffc994;
        padding: 10px 20px; /* เพิ่มพื้นที่ด้านในปุ่มให้กดง่ายขึ้นบนมือถือ */
    }

    .error {
        margin: 15px auto 0 auto;
        text-align: center;
        font-size: 18px;
        color: #ffa294;
        width: 100%;
    }
</style>
</head>
<body>
    <h1>ใครเอ่ยน่ารักที่สุด?</h1>
    <div class=box> 
    <button class = "B1" onclick="check()">เอิร์นไงง</button> <button class="B2" onclick="checkerror()">แมวแถวบ้าน</button>
    
    <p class="error" id="incorrect"></p>
    </div>

    <script>
        let message = [
            "",
            "อาจจะยังน้าา",
            "ไม่ใช่ๆ",
            "ก็บอกว่าไม่ใช่ไงง",
            "แหนะบอกไม่ฟังอีก",
            "กดปุ่มซ้ายสิ"
        ];

        let currentnum = 0;

        function check() {
            window.location.href ="success2.html"
        }
        
        function checkerror() {
            currentnum++;
            if (currentnum >= message.length) {
                currentnum = 1;
            }
            document.getElementById("incorrect").innerText =message[currentnum];
            //document.getElementById("incorrect").innerText ="ไม่ใช่ๆ"
        }
    </script>
</body>
</html>
