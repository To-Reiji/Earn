<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> for kon narak</title>
<style>
    html,body {
        background-color: #ffedff;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .box {
        text-align: center;
        width: 100%
    }
    h1 {
        margin: 0 0 20px 0;
        text-align: center;
        font-size: 60px;
        color: #ff9cf8;   
    }
    
    .Name {
        display: inline-block;
        text-align: center;
        font-size: 24px;
        max-width: 350px;
        width: 80%;
        height: 45px;
        margin-bottom: 15px;
    }
    
    button {
        display: block;
        border: 2px solid #ffc994;
        font-size: 24px;
        margin: 0 auto;
        background-color: #fffad4;
        border-radius: 8px;
        cursor: pointer;
        padding: 5px 20px;
    }

    .error{
        margin: 10px auto 0 auto;
        text-align: center;
        font-size: 20px;
        color: #ffa294;
    }
</style> 
</head>
<body>
    <h1>
        สำหรับคนสวย
    </h1>
    
    <div class="box">
        <input type="text" class="Name" id="userInput" placeholder="ขอชื่อคนน่ารักหนึ่งคน"><br><br>
        <button onclick="checkName()">ยืนยัน</button>
        
        <p class = "error" id="errorName"></p> 
    </div>

    <script>
        function checkName() {
            let inputval = document.getElementById("userInput").value;

            let correctName = ["Earn", "earn", "เอิร์น", "เอิน"];

            if (correctName.includes(inputval)) {
                window.location.href = "success.html";
            } else {
                document.getElementById("errorName").innerText = "ใช่รึป่าวนะะ";
            }
        }
    </Script>
</body>
</html>
