<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> for kon narak</title>
<style>
   html, body {
        background-image: url('Happy (1920 x 1080 px).png'); 
        background-size: cover;          /* ให้รูปขยายเต็มจอพอดี */
        background-position: center;     /* จัดรูปให้อยู่กึ่งกลาง */
        background-repeat: no-repeat;
        background-color: #ffedff;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .box {
        text-align: center;
        width: 100%;
    }
    
    h1 {
        margin: 0 0 25px 0;
        text-align: center;
        font-size: 55px; /* ปรับลดขนาดลงนิดนึงเผื่อจอมือถือเล็ก จะได้ไม่ยาวเกินไป */
        padding: 0 15px;
    }

    button {
        font-size: 25px;
        background-color: #fffad4;
        border-radius: 8px;
        cursor: pointer;
        border: 2px solid #ffc994;
        padding: 10px 0; /* ใช้ padding บน-ล่างซ้าย-ขวาเป็น 0 เพื่อคุมความกว้างด้วย width */
        width: 220px;    /* กำหนดความกว้างตายตัว ปุ่มจะเท่ากันเป๊ะ */
        display: inline-block;
        text-align: center;
    }

</style>
</head>
<body>
    <h1>เสียใจอะร้องไห้แล้วว</h1>
    <div class"box">
    <button onclick="correct()">ให้โอกาสตอบใหม่</button>
    </div>
</body>
<script>
    function correct() {
        window.location.href = "success4.html"
    }
</script>
</html>
