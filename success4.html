<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> for kon narak</title>
<style>
   html, body {
        background-color: #ffedff;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    
    .container {
        width: 100%;
        text-align: center;
    }

    h1 {
        margin: 0 0 20px 0;
        text-align: center;
        font-size: 45px; 
        color: #ff9cf8;
        padding: 0 15px;
    }

    .B1, .B2, .B3, .B4 {
        font-size: 20px;
        background-color: #fffad4;
        border-radius: 8px;
        cursor: pointer;
        border: 2px solid #ffc994;
        padding: 10px 0; /* ใช้ padding บน-ล่างซ้าย-ขวาเป็น 0 เพื่อคุมความกว้างด้วย width */
        width: 22px;    /* กำหนดความกว้างตายตัว ปุ่มจะเท่ากันเป๊ะ */
        display: inline-block;
        text-align: center;    
    }

   
</style>
</head>
<body>
    <h1>ชอบคนที่สร้างเว็บนี้มั้ย</h1>
    <div class="container">
    <button class="B1" onclick="correct()">ชอบ</button><button class="B2" onclick="Cl2()">ชอบมากๆๆๆๆ</button><button class="B3" onclick="Cl3()">รักเลยแหละ</button><button class="B4" onclick="incorrect()">ไม่ชอบ</button>
    </div>
</body>
<script>
    function correct() {
        window.location.href = "success5.html"
    }

    function Cl2() {
        window.location.href = "success5.html"
    }

    function Cl3() {
        window.location.href = "success5.html"
    }

    function incorrect() {
        window.location.href = "sp.html";
    }
</script>
</html>
